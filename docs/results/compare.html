<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side-by-Side Algorithm Comparison - netopt</title>
    <style>
        :root {
            --primary: #1976D2;
            --primary-dark: #0D47A1;
            --surface: #FFFFFF;
            --bg: #F0F4F8;
            --text: #263238;
            --border: #CFD8DC;
            --accepted: #2E7D32;
            --rejected: #D32F2F;
            --candidate: #F57C00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 { color: var(--primary-dark); font-size: 24px; }
        .summary-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
        }
        .cost-left { background: #E1F5FE; color: #0277BD; border: 1px solid #81D4FA; }
        .cost-right { background: #EDE7F6; color: #4527A0; border: 1px solid #B39DDB; }
        .match-success { background: #E8F5E9; color: #1B5E20; border: 1px solid #A5D6A7; }
        .match-fail { background: #FFEBEE; color: #C62828; border: 1px solid #EF9A9A; }
        .warning-banner {
            background: #FFF9C4;
            color: #F57F17;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 5px solid #FBC02D;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #FAFAFA;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 9px 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:hover { background: var(--primary-dark); }
        input[type=range] {
            flex-grow: 1;
            height: 8px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        .counter {
            font-weight: 700;
            color: #546E7A;
            font-size: 14px;
            min-width: 90px;
            text-align: right;
        }
        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .columns { grid-template-columns: 1fr; }
        }
        .col-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            background: #FAFAFA;
            display: flex;
            flex-direction: column;
        }
        .col-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .col-step {
            background: #ECEFF1;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            min-height: 40px;
            display: flex;
            align-items: center;
        }
        .viewport {
            background: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            min-height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: auto;
            flex-grow: 1;
        }
        svg {
            max-width: 100%;
            height: auto;
            max-height: 480px;
            display: block;
            margin: 0 auto;
        }
        img {
            max-width: 100%;
            height: auto;
            max-height: 480px;
            display: block;
            margin: 0 auto;
        }
        pre.fallback-code {
            background: #263238;
            color: #ECEFF1;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            width: 100%;
            max-height: 400px;
            overflow: auto;
        }
        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #78909C;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Side-by-Side Algorithm Replay</h1>
        <div class="summary-bar">
            <span class="badge cost-left">Prim's Algorithm: 5,300</span>
            <span class="badge cost-right">Kruskal's Algorithm: 5,300</span>
            <span class="badge match-success">COST MATCH (IDENTICAL)</span>
        </div>
    </header>

    

    <div class="controls">
        <button id="btn-prev" onclick="prevStep()">&#9664; Prev</button>
        <button id="btn-play" onclick="togglePlay()">Play</button>
        <button id="btn-next" onclick="nextStep()">Next &#9654;</button>
        <input type="range" id="frame-range" min="0" max="22" value="0" oninput="seekTo(this.value)">
        <span class="counter" id="frame-counter">1 / 23</span>
    </div>

    <div class="columns">
        <div class="col-card">
            <div class="col-title">
                <span>Prim's Algorithm</span>
                <span id="left-cost" style="font-size:14px; color:#0277BD;">Cost: -</span>
            </div>
            <div class="col-step" id="left-step">Loading...</div>
            <div class="viewport" id="left-viewport"></div>
        </div>

        <div class="col-card">
            <div class="col-title">
                <span>Kruskal's Algorithm</span>
                <span id="right-cost" style="font-size:14px; color:#4527A0;">Cost: -</span>
            </div>
            <div class="col-step" id="right-step">Loading...</div>
            <div class="viewport" id="right-viewport"></div>
        </div>
    </div>

    <footer>
        Keyboard Shortcuts: <strong>&larr; / &rarr;</strong>: Prev / Next &bull; <strong>Space</strong>: Play / Pause &bull; <strong>Home / End</strong>: First / Last Frame
    </footer>
</div>

    const maxSteps = 23;
    let currentIdx = 0;
    let timer = null;

    function renderColumn(frames, idx, stepElemId, costElemId, vpElemId) {
        const clampedIdx = Math.min(idx, frames.length - 1);
        const f = frames[clampedIdx];

        const stepEl = document.getElementById(stepElemId);
        const costEl = document.getElementById(costElemId);
        const vpEl = document.getElementById(vpElemId);

        if (idx >= frames.length) {
            stepEl.innerHTML = f.label + " <em>(Execution Completed)</em>";
        } else {
            stepEl.innerText = f.label;
        }

        if (f.runningCost !== null && f.runningCost !== undefined) {
            costEl.innerText = "Running Cost: " + Number(f.runningCost).toLocaleString();
        }

        if (f.graphic) {
            if (f.graphic.startsWith("data:image")) {
                vpEl.innerHTML = '<img src="' + f.graphic + '" alt="Frame">';
            } else {
                vpEl.innerHTML = f.graphic;
            }
        } else {
            vpEl.innerHTML = '<pre class="fallback-code">' +
                f.dotSource.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                '</pre>';
        }
    }

    function updateView() {
        document.getElementById('frame-range').value = currentIdx;
        document.getElementById('frame-counter').innerText = (currentIdx + 1) + " / " + maxSteps;

        renderColumn(leftFrames, currentIdx, 'left-step', 'left-cost', 'left-viewport');
        renderColumn(rightFrames, currentIdx, 'right-step', 'right-cost', 'right-viewport');
    }

    function seekTo(val) {
        currentIdx = parseInt(val, 10);
        updateView();
    }

    function prevStep() {
        if (currentIdx > 0) {
            currentIdx--;
            updateView();
        }
    }

    function nextStep() {
        if (currentIdx < maxSteps - 1) {
            currentIdx++;
            updateView();
        } else if (timer) {
            togglePlay();
        }
    }

    function togglePlay() {
        const btn = document.getElementById('btn-play');
        if (timer) {
            clearInterval(timer);
            timer = null;
            btn.innerText = "Play";
        } else {
            btn.innerText = "Pause";
            timer = setInterval(nextStep, 1000);
        }
    }

    window.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
        if (e.key === "ArrowLeft") {
            e.preventDefault();
            prevStep();
        } else if (e.key === "ArrowRight") {
            e.preventDefault();
            nextStep();
        } else if (e.key === " ") {
            e.preventDefault();
            togglePlay();
        } else if (e.key === "Home") {
            e.preventDefault();
            seekTo(0);
        } else if (e.key === "End") {
            e.preventDefault();
            seekTo(maxSteps - 1);
        }
    });

    updateView();
</script>
