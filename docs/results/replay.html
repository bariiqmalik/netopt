<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Replay - Network Cable Optimization</title>
    <style>
        :root {
            --primary: #1976D2;
            --primary-dark: #0D47A1;
            --surface: #FFFFFF;
            --bg: #F0F4F8;
            --text: #263238;
            --border: #CFD8DC;
            --accepted: #2E7D32;
            --rejected: #D32F2F;
            --candidate: #F57C00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { color: var(--primary-dark); font-size: 24px; }
        .cost-badge {
            background: #E8F5E9;
            color: #1B5E20;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid #A5D6A7;
        }
        .warning-banner {
            background: #FFF9C4;
            color: #F57F17;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 5px solid #FBC02D;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .warning-banner code {
            background: rgba(0,0,0,0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        .step-banner {
            background: #E3F2FD;
            color: #0D47A1;
            padding: 14px 20px;
            border-radius: 8px;
            border-left: 5px solid var(--primary);
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #FAFAFA;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 9px 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.15s ease;
        }
        button:hover { background: var(--primary-dark); }
        input[type=range] {
            flex-grow: 1;
            height: 8px;
            border-radius: 4px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        .counter {
            font-weight: 700;
            color: #546E7A;
            font-size: 14px;
            min-width: 90px;
            text-align: right;
        }
        .legend {
            display: flex;
            gap: 18px;
            justify-content: center;
            font-size: 13px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .indicator { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
        .ind-accepted { background: var(--accepted); }
        .ind-rejected { background: var(--rejected); }
        .ind-candidate { background: var(--candidate); }
        .ind-unseen { background: #B0BEC5; border: 1px dashed #78909C; }
        .frame-viewport {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #FAFAFA;
            min-height: 450px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }
        svg {
            max-width: 100%;
            height: auto;
            max-height: 520px;
            display: block;
            margin: 0 auto;
        }
        img {
            max-width: 100%;
            height: auto;
            max-height: 520px;
            display: block;
            margin: 0 auto;
        }
        pre.fallback-code {
            text-align: left;
            background: #263238;
            color: #ECEFF1;
            padding: 20px;
            border-radius: 8px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.4;
            overflow-x: auto;
            width: 100%;
            max-height: 480px;
        }
        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #78909C;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Algorithm Replay</h1>
        <div class="cost-badge" id="cost-badge">Running Cost: -</div>
    </header>

    

    <div class="step-banner" id="step-banner">Loading frame...</div>

    <div class="controls">
        <button id="btn-prev" onclick="prevStep()">&#9664; Prev</button>
        <button id="btn-play" onclick="togglePlay()">Play</button>
        <button id="btn-next" onclick="nextStep()">Next &#9654;</button>
        <input type="range" id="frame-range" min="0" max="11" value="0" oninput="seekTo(this.value)">
        <span class="counter" id="frame-counter">1 / 12</span>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="indicator ind-accepted"></span> <strong>Accepted (In Tree)</strong></div>
        <div class="legend-item"><span class="indicator ind-rejected"></span> <strong>Rejected (Cycle)</strong></div>
        <div class="legend-item"><span class="indicator ind-candidate"></span> <strong>Candidate</strong></div>
        <div class="legend-item"><span class="indicator ind-unseen"></span> <strong>Unvisited</strong></div>
    </div>

    <div class="frame-viewport" id="viewport">
        <!-- Rendered Graphic or Code Fallback -->
    </div>

    <footer>
        Keyboard Shortcuts: <strong>&larr; / &rarr;</strong>: Prev / Next &bull; <strong>Space</strong>: Play / Pause &bull; <strong>Home / End</strong>: First / Last Frame
    </footer>
</div>

    function updateView() {
        const f = frames[currentIdx];
        document.getElementById('step-banner').innerText = f.label;
        document.getElementById('frame-range').value = currentIdx;
        document.getElementById('frame-counter').innerText = (currentIdx + 1) + " / " + frames.length;

        const costBadge = document.getElementById('cost-badge');
        if (f.runningCost !== null && f.runningCost !== undefined) {
            costBadge.innerText = "Running MST Cost: " + Number(f.runningCost).toLocaleString();
            costBadge.style.display = "inline-block";
        } else {
            costBadge.style.display = "none";
        }

        const vp = document.getElementById('viewport');
        if (f.graphic) {
            if (f.graphic.startsWith("data:image")) {
                vp.innerHTML = '<img src="' + f.graphic + '" alt="Frame ' + (currentIdx + 1) + '">';
            } else {
                vp.innerHTML = f.graphic;
            }
        } else {
            vp.innerHTML = '<pre class="fallback-code">' +
                f.dotSource.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                '</pre>';
        }
    }

    function seekTo(val) {
        currentIdx = parseInt(val, 10);
        updateView();
    }

    function prevStep() {
        if (currentIdx > 0) {
            currentIdx--;
            updateView();
        }
    }

    function nextStep() {
        if (currentIdx < frames.length - 1) {
            currentIdx++;
            updateView();
        } else if (timer) {
            togglePlay();
        }
    }

    function togglePlay() {
        const btn = document.getElementById('btn-play');
        if (timer) {
            clearInterval(timer);
            timer = null;
            btn.innerText = "Play";
        } else {
            btn.innerText = "Pause";
            timer = setInterval(nextStep, 1000);
        }
    }

    // Keyboard support
    window.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
        if (e.key === "ArrowLeft") {
            e.preventDefault();
            prevStep();
        } else if (e.key === "ArrowRight") {
            e.preventDefault();
            nextStep();
        } else if (e.key === " ") {
            e.preventDefault();
            togglePlay();
        } else if (e.key === "Home") {
            e.preventDefault();
            seekTo(0);
        } else if (e.key === "End") {
            e.preventDefault();
            seekTo(frames.length - 1);
        }
    });

    updateView();
</script>
</body>
</html>
